<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0E7C70"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><link rel="apple-touch-icon" href="icon.svg"><title>Plano de Força em Casa</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: menu lateral fixo no desktop e gaveta no celular; uma visão por vez; cronômetro fixo na base da tela. */
:root{
  --bg:#EEF2EF; --surface:#FFFFFF; --ink:#1B2826; --muted:#586966; --faint:#A9B7B4;
  --line:#D6DEDB; --accent:#0E7C70; --accent-soft:#D9EFEB; --on-accent:#FFFFFF;
  --warn:#9A4B06; --warn-soft:#FBEBD6; --rest:#2F5F9E;
  --display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --body:'Figtree','Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1514; --surface:#18211F; --ink:#E5EEEC; --muted:#9DB0AC; --faint:#5A6D69;
  --line:#2A3835; --accent:#5CC9BC; --accent-soft:#17332F; --on-accent:#0F1514;
  --warn:#F0B070; --warn-soft:#38291A; --rest:#8FB6EC; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1514; --surface:#18211F; --ink:#E5EEEC; --muted:#9DB0AC; --faint:#5A6D69;
  --line:#2A3835; --accent:#5CC9BC; --accent-soft:#17332F; --on-accent:#0F1514;
  --warn:#F0B070; --warn-soft:#38291A; --rest:#8FB6EC; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 16px/1.55 var(--body);padding-inline:16px;padding-block:0 40px}
body.timing{padding-bottom:230px}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:clamp(1.9rem,6vw,2.6rem);font-weight:700;letter-spacing:-.02em}
h2{font-size:1.5rem;font-weight:700}
h3{font-size:1.1rem;font-weight:700}
p{margin:0}
a{color:var(--accent)}
button{font-family:var(--body)}
.meta{color:var(--muted);font-size:.95rem}
.lead{color:var(--muted);font-size:1.05rem;max-width:60ch}
.eyebrow{font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:6px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* estrutura */
.shell{max-width:1040px;margin:0 auto;display:block}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:12px;padding-block:12px;border-bottom:1px solid var(--line);margin-bottom:20px}
.menu-btn{font:600 .9rem var(--body);border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 14px;cursor:pointer}
.topbar b{font-family:var(--display);font-size:1.05rem}
.side{position:fixed;top:0;bottom:0;left:0;width:min(82vw,290px);background:var(--surface);border-right:1px solid var(--line);z-index:50;transform:translateX(-105%);transition:transform .2s;padding:calc(18px + env(safe-area-inset-top,0px)) 14px 18px;overflow-y:auto;display:flex;flex-direction:column;gap:18px}
.side.open{transform:none}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40}
.brand{font-family:var(--display);font-weight:700;font-size:1.25rem;line-height:1.15;padding-inline:8px}
.brand span{display:block;font:500 .78rem var(--body);color:var(--muted);margin-top:4px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav small{font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:12px 8px 4px}
.nav button{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:none;color:var(--ink);font:500 .98rem var(--body);padding:10px 8px;border-radius:8px;cursor:pointer}
.nav button:hover{background:var(--bg)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.pill{font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;background:var(--accent);color:var(--on-accent);border-radius:99px;padding:2px 8px;font-weight:600}
.dim{color:var(--muted);font-size:.8rem}
main{min-width:0;display:flex;flex-direction:column;gap:32px;padding-bottom:24px}
@media (min-width:900px){
  .shell{display:grid;grid-template-columns:250px minmax(0,1fr);gap:36px;align-items:start}
  .topbar{display:none}
  .side{position:sticky;top:0;transform:none;width:auto;height:100vh;border-right:0;background:none;padding:28px 0 18px;z-index:1}
  main{padding-top:28px;max-width:760px}
  .menu-only{display:none}
}

/* componentes */
.view{display:flex;flex-direction:column;gap:20px;min-width:0}
.callout{background:var(--warn-soft);border-radius:10px;padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.callout strong{color:var(--warn)}
.callout ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.today{background:var(--accent);color:var(--on-accent);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:10px}
.today h1{color:var(--on-accent)}
.today .eyebrow{color:var(--on-accent);opacity:.85}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{font:600 .95rem var(--body);border-radius:10px;padding:10px 16px;cursor:pointer;border:1px solid var(--accent);background:var(--accent);color:var(--on-accent)}
.btn.alt{background:var(--surface);color:var(--accent)}
.today .btn{background:var(--on-accent);color:var(--accent);border-color:var(--on-accent)}
.today .btn.alt{background:transparent;color:var(--on-accent);border-color:var(--on-accent)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 2px;text-align:center;font-size:.8rem;display:flex;flex-direction:column;gap:2px;min-width:0;cursor:pointer;color:var(--ink)}
.day b{font-family:var(--display);font-size:.95rem}
.day span{color:var(--muted);font-size:.68rem}
.day.t{border-color:var(--accent)}
.day.now{background:var(--accent);border-color:var(--accent)}
.day.now,.day.now span{color:var(--on-accent)}
.ex-list{display:flex;flex-direction:column;gap:14px}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.ex-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.dose{font-weight:600;color:var(--accent);font-variant-numeric:tabular-nums;white-space:nowrap}
.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.fig{background:var(--bg);border-radius:8px;padding:8px 8px 6px;display:flex;flex-direction:column;gap:2px;min-width:0;margin:0}
.fig svg{width:100%;height:auto;display:block;max-height:150px}
.fig figcaption{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:center}
.fig line,.fig polyline{fill:none;stroke-linecap:round;stroke-linejoin:round}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.tip{font-size:.92rem;background:var(--accent-soft);border-radius:8px;padding:10px 12px}
.tip.w{background:var(--warn-soft)}
.tip b{font-weight:600}
.scroller{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:520px;font-size:.93rem}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
tr:last-child td{border-bottom:0}
.ok{color:var(--accent);font-weight:600}
.no{color:var(--warn);font-weight:600}
.track{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.grid{display:grid;grid-template-columns:auto repeat(3,1fr);gap:6px 8px;align-items:center;font-size:.9rem}
.grid .h{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.chk{appearance:none;width:100%;height:34px;border:1px solid var(--line);border-radius:8px;background:var(--bg);cursor:pointer;margin:0;display:block}
.chk:checked{background:var(--accent);border-color:var(--accent)}
.chk:checked::after{content:"";display:block;width:9px;height:16px;border:solid var(--on-accent);border-width:0 3px 3px 0;transform:translate(0,2px) rotate(45deg);margin:0 auto}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.src{font-size:.9rem;color:var(--muted);display:flex;flex-direction:column;gap:4px;margin:0;padding-left:18px}
button.link{font:500 .85rem var(--body);background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;padding:0;align-self:flex-start}

/* cronômetro */
.timer{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--surface);border-top:3px solid var(--accent);padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 24px rgba(0,0,0,.18)}
.timer[data-phase="rest"]{border-top-color:var(--rest)}
.timer[data-phase="reps"]{border-top-color:var(--ink)}
.t-in{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.t-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.t-phase{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:var(--accent)}
.timer[data-phase="rest"] .t-phase{color:var(--rest)}
.timer[data-phase="reps"] .t-phase{color:var(--ink)}
.t-clock{font:700 clamp(2.6rem,12vw,3.6rem)/1 var(--display);font-variant-numeric:tabular-nums;letter-spacing:-.02em;white-space:nowrap}
.t-clock.sm{font-size:clamp(1.6rem,7vw,2.2rem)}
.t-title{font-weight:600}
.t-sub{color:var(--muted);font-size:.9rem}
.t-next{font-size:.85rem;color:var(--muted)}
.t-bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.t-bar i{display:block;height:100%;width:0;background:var(--accent)}
.timer[data-phase="rest"] .t-bar i{background:var(--rest)}
.t-btns{display:flex;gap:8px;flex-wrap:wrap}
.t-btns .btn{padding:9px 14px;font-size:.9rem}
.ex-link{font:inherit;font-weight:600;background:none;border:0;color:var(--accent);text-decoration:underline;padding:0;cursor:pointer;text-align:left}
.ex-hint{color:var(--muted);font-size:.85rem;font-weight:400}
.modal{position:fixed;inset:0;z-index:80;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.55)}
.modal[hidden]{display:none}
.sheet{background:var(--bg);width:100%;max-width:760px;max-height:88vh;overflow-y:auto;border-radius:16px 16px 0 0;padding:0 16px calc(16px + env(safe-area-inset-bottom,0px))}
.sheet-h{position:sticky;top:0;background:var(--bg);display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0 10px;z-index:1}
.mclock{font:700 1.6rem/1.1 var(--display);font-variant-numeric:tabular-nums}
.set{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:10px 0;border-bottom:1px solid var(--line)}
.set:last-of-type{border-bottom:0}
.set input[type=checkbox]{width:24px;height:24px;accent-color:var(--accent);flex:none}
.set select{max-width:55%;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.t-vol{background:var(--bg);border-radius:10px;padding:2px 12px}
.set.vol input[type=range]{width:55%;accent-color:var(--accent)}
.bform{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.bform label{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted);min-width:0}
.bform input{font:inherit;font-size:1rem;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);min-width:0;width:100%}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font:10px var(--body)}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.chart .dot{fill:var(--accent)}
.chart .gl{stroke:var(--line);stroke-width:1}
.sum{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.95rem}
.sum b{font-weight:600}
.rm{font:500 .8rem var(--body);background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;padding:0}
#history{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
@media (prefers-reduced-motion:reduce){.bar i,.side{transition:none}}
</style>

<div class="shell">
  <div class="topbar">
    <button class="menu-btn" id="menuBtn" type="button" aria-expanded="false" aria-controls="side">Menu</button>

</div>

<template id="tpl-safety">
  <div class="callout">
    <strong>Antes de começar</strong>
    <p>Dor lombar frequente e tendinite merecem avaliação de um médico ou fisioterapeuta. Este plano é conservador, mas não substitui essa consulta.</p>
    <ul>
      <li><b>Semáforo de dor:</b> até 3 em 10 é aceitável. A partir de 4, reduza o movimento ou troque o exercício. Dor aguda, formigamento ou dor que desce para a perna: pare e procure atendimento.</li>
      <li><b>Ombro esquerdo:</b> nada acima da cabeça, sem flexão no chão e sem se pendurar em barra nas primeiras 4 semanas. Cotovelos a cerca de 45° do corpo.</li>
      <li><b>Lombar:</b> sem abdominal clássico e sem elevar as duas pernas retas. Mantenha a coluna em posição neutra.</li>
      <li><b>Impacto:</b> sem pulos por enquanto. O gasto de energia vem do volume e da constância.</li>
    </ul>
  </div>
</template>

<template id="tpl-progress">
  <div class="view">
    <div><h2>Progresso</h2><p class="meta" style="margin-top:4px">Marque cada treino concluído. As marcações ficam salvas neste aparelho.</p></div>
    <div class="track">
      <b id="count">0 de 36 treinos</b>
      <div class="bar"><i id="barfill"></i></div>
      <div class="grid" id="grid"></div>
      <button class="link" id="reset" type="button">Limpar marcações</button>
    </div>
    <h3>Peso e medidas</h3>
    <p class="meta">Opcional. Preencha só o que quiser e salve de tempos em tempos (por exemplo, a cada 2 semanas) para comparar a evolução. Meça sempre no mesmo horário, de preferência de manhã.</p>
    <form class="card" id="bodyForm" autocomplete="off">
      <div class="bform">
        <label>Data<input type="date" id="bDate"></label>
        <label>Peso (kg)<input type="text" inputmode="decimal" id="b_w" placeholder="ex.: 75,4"></label>
        <label>Braço (cm)<input type="text" inputmode="decimal" id="b_arm" placeholder="ex.: 29"></label>
        <label>Perna (cm)<input type="text" inputmode="decimal" id="b_leg" placeholder="ex.: 58"></label>
        <label>Abdômen (cm)<input type="text" inputmode="decimal" id="b_abd" placeholder="ex.: 88"></label>
        <label>Peito (cm)<input type="text" inputmode="decimal" id="b_chest" placeholder="ex.: 95"></label>
      </div>
      <p class="meta">Onde medir: braço relaxado na parte mais larga; perna (coxa) no ponto mais largo; abdômen na altura do umbigo; peito na altura dos mamilos, com a fita nivelada.</p>
      <div class="btns"><button class="btn" type="submit">Salvar medidas</button><span class="meta" id="bMsg" role="status"></span></div>
    </form>
    <div id="bodyOut"></div>
    <h3>Últimos registros</h3>
    <ul id="history"></ul>
    <h3>Como progredir</h3>
    <div class="scroller"><table>
      <tr><th>Fase</th><th>Quando</th><th>O que muda</th></tr>
      <tr><td><b>1</b></td><td>Semanas 1 a 4</td><td>Treinos como estão. O objetivo é aprender a técnica e terminar sem dor.</td></tr>
      <tr><td><b>2</b></td><td>Semanas 5 a 8</td><td>Mais uma série nos exercícios principais e 2 repetições a mais. Descidas de 3 segundos.</td></tr>
      <tr><td><b>3</b></td><td>Semanas 9 a 12</td><td>Versões mais difíceis: bancada mais baixa na flexão, prancha lateral apoiada nos pés, afundo mais fundo. Só avance se ombro e lombar estiverem tranquilos.</td></tr>
    </table></div>
    <p class="meta">Depois de 8 a 12 semanas o volume precisa subir para continuar evoluindo.</p>
  </div>
</template>

<template id="tpl-guia">
  <div class="view">
    <h2>Guia e fontes</h2>
    <div data-safety></div>
    <h3>O que funciona e o que é propaganda</h3>
    <p class="meta">A busca que fiz não encontrou estudos controlados sobre nenhum desses treinos virais. O que existe são reportagens e opiniões de profissionais.</p>
    <div class="scroller"><table>
      <tr><th>Tendência</th><th>Veredito</th></tr>
      <tr><td><b>"Lazy girl workout"</b><br>10 a 15 min, quase tudo deitada</td><td>É exercício de baixo impacto com outro nome. <span class="ok">Ajuda a criar o hábito.</span> <span class="no">Não há dados de que queime mais gordura.</span></td></tr>
      <tr><td><b>12-3-30</b><br>esteira a 12% de inclinação, 5 km/h, 30 min</td><td>Caminhada inclinada de baixa intensidade, <span class="ok">boa para as articulações</span>. <span class="no">Resultados "em uma semana" são relatos, não evidência.</span></td></tr>
      <tr><td><b>Wall Pilates</b></td><td><span class="ok">Útil para core, equilíbrio e postura</span>, e a parede dá estabilidade. <span class="no">Não substitui treino de força.</span></td></tr>
      <tr><td><b>"Resultado notável em poucos meses"</b></td><td><span class="no">Exagero.</span> A perda de gordura depende do déficit calórico, ou seja, da alimentação. O treino preserva o músculo e sustenta a rotina.</td></tr>
    </table></div>
    <p class="meta">Aproveitado neste plano: sessões curtas e de baixo impacto, uso da parede como apoio e as caminhadas nos dias de descanso.</p>
    <h3>Alimentação e expectativa</h3>
    <div class="two">
      <div class="card"><h3>O que mais pesa</h3><p>Déficit moderado, de 300 a 500 kcal abaixo da manutenção, com proteína em todas as refeições, 7 a 9 horas de sono e água ao longo do dia. Um nutricionista pode ajustar os números.</p></div>
      <div class="card"><h3>Ritmo realista</h3><p>0,25 a 0,5 kg por semana, ou 3 a 6 kg em 12 semanas. Acompanhe também a cintura, fotos e a força nos exercícios, porque a balança sozinha engana.</p></div>
    </div>
    <h3>Fontes</h3>
    <ul class="src">
      <li><a href="https://fortune.com/well/2023/08/28/lazy-girl-workouts-tips-tricks/amp">Fortune, sobre o Lazy Girl Workout</a></li>

  var todayView=PLAN[TODAY].v;
  NAV.forEach(function(n){
    if(n.length===1){var s=document.createElement('small');s.textContent=n[0];nav.appendChild(s);return}
    var b=document.createElement('button');b.type='button';b.dataset.act='go';b.dataset.v=n[0];
    if(n[0]===current)b.setAttribute('aria-current','page');
    var tag=(n[0]===todayView&&n[0]!=='hoje')?'<span class="pill">hoje</span>':(n[2]?'<span class="dim">'+n[2]+'</span>':'');
    b.innerHTML='<span>'+n[1]+'</span>'+tag;nav.appendChild(b);

}

var KEY='pf-done',done={};
try{done=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){done={}}
function updateCount(){
  var n=Object.keys(done).length;
  document.getElementById('count').textContent=n+' de 36 treinos';
  document.getElementById('barfill').style.width=(n/36*100)+'%';
}
function bindTracker(){
  var grid=document.getElementById('grid');
  grid.innerHTML='<span class="h">Semana</span><span class="h">A</span><span class="h">B</span><span class="h">C</span>';
  for(var w=1;w<=12;w++){
    var lab=document.createElement('span');lab.textContent=w;grid.appendChild(lab);
    ['A','B','C'].forEach(function(t,ti){
      var id=w+t,c=document.createElement('input');c.type='checkbox';c.className='chk';c.checked=!!done[id];
      c.setAttribute('aria-label','Semana '+w+', treino '+t);
      c.onchange=function(){if(c.checked)done[id]=1;else delete done[id];try{localStorage.setItem(KEY,JSON.stringify(done))}catch(e){}updateCount()};
      grid.appendChild(c);
    });
  }
  document.getElementById('reset').onclick=function(){
    done={};try{localStorage.removeItem(KEY)}catch(e){}
    grid.querySelectorAll('.chk').forEach(function(c){c.checked=false});updateCount();
  };
  updateCount();
  bindBody();
  document.getElementById('history').innerHTML=Object.keys(LOG).sort().reverse().slice(0,10).map(function(d){
    var p=d.split('-');return '<li>'+p[2]+'/'+p[1]+' · '+LOG[d].map(function(k){return LABEL[k]}).join(', ')+'</li>';
  }).join('')||'<li class="meta">Nenhum registro ainda. Os treinos concluídos pelo cronômetro aparecem aqui.</li>';
}

function ymd(d){d=d||new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
var LABEL={A:'Treino A',B:'Treino B',C:'Treino C',W:'Caminhada'};
function register(job){
  if(job.kind==='warm')return '';
  var date=ymd();LOG[date]=LOG[date]||[];
  var key=job.kind==='workout'?job.k:'W';
  if(LOG[date].indexOf(key)>-1)return 'Já estava registrado hoje.';
  LOG[date].push(key);saveLog();
  if(job.kind==='workout'){
    for(var w=1;w<=12;w++){if(!done[w+job.k]){done[w+job.k]=1;try{localStorage.setItem(KEY,JSON.stringify(done))}catch(e){}return 'Treino registrado na semana '+w+'.'}}
    return 'Treino registrado.';
  }
  return 'Caminhada registrada.';
}

var BF=[['w','Peso','kg'],['arm','Braço','cm'],['leg','Perna','cm'],['abd','Abdômen','cm'],['chest','Peito','cm']];
function parseNum(v){var n=parseFloat(String(v||'').trim().replace(',','.'));return isFinite(n)&&n>0&&n<500?Math.round(n*10)/10:null}
function nf(n){return n==null?'—':n.toLocaleString('pt-BR',{maximumFractionDigits:1})}
function dbr(d){var p=d.split('-');return p[2]+'/'+p[1]+'/'+p[0].slice(2)}
function bodyChart(){
  var pts=BODY.filter(function(r){return r.w!=null});
  if(pts.length<2)return '';
  var W=320,H=130,L=34,R=12,Tp=14,B=24;
  var ts=pts.map(function(r){return Date.parse(r.d)}),t0=ts[0],t1=ts[ts.length-1]||t0+1;
  var vs=pts.map(function(r){return r.w}),lo=Math.min.apply(null,vs)-0.5,hi=Math.max.apply(null,vs)+0.5;
  var X=function(t){return L+(t1===t0?0:(t-t0)/(t1-t0))*(W-L-R)},Y=function(v){return Tp+(1-(v-lo)/(hi-lo))*(H-Tp-B)};
  var line=pts.map(function(r,i){return X(ts[i]).toFixed(1)+','+Y(r.w).toFixed(1)}).join(' ');
  var dots=pts.map(function(r,i){return '<circle class="dot" cx="'+X(ts[i]).toFixed(1)+'" cy="'+Y(r.w).toFixed(1)+'" r="3.5"/>'}).join('');
  var last=pts[pts.length-1];
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Gráfico do peso ao longo do tempo">'+
   '<line class="gl" x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(hi).toFixed(1)+'" y2="'+Y(hi).toFixed(1)+'"/><line class="gl" x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(lo).toFixed(1)+'" y2="'+Y(lo).toFixed(1)+'"/>'+
   '<text x="'+(L-4)+'" y="'+(Y(hi)+3).toFixed(1)+'" text-anchor="end">'+nf(Math.round(hi*10)/10)+'</text><text x="'+(L-4)+'" y="'+(Y(lo)+3).toFixed(1)+'" text-anchor="end">'+nf(Math.round(lo*10)/10)+'</text>'+
   '<polyline class="ln" points="'+line+'"/>'+dots+
   '<text x="'+X(ts[ts.length-1]).toFixed(1)+'" y="'+(Y(last.w)-8).toFixed(1)+'" text-anchor="end">'+nf(last.w)+' kg</text>'+
   '<text x="'+L+'" y="'+(H-6)+'">'+dbr(pts[0].d)+'</text><text x="'+(W-R)+'" y="'+(H-6)+'" text-anchor="end">'+dbr(last.d)+'</text></svg>';
}
function renderBody(){
  var out=document.getElementById('bodyOut');if(!out)return;
  if(!BODY.length){out.innerHTML='<p class="meta">Nenhuma medida salva ainda.</p>';return}
  // variação entre a primeira e a última medida de cada item
  var sum=BF.map(function(f){
    var rs=BODY.filter(function(r){return r[f[0]]!=null});
    if(rs.length<2)return '';
    var d=Math.round((rs[rs.length-1][f[0]]-rs[0][f[0]])*10)/10;
    return '<span>'+f[1]+': <b>'+(d>0?'+':'')+nf(d)+' '+f[2]+'</b></span>';
  }).filter(Boolean).join('');
  var rows=BODY.slice().reverse().map(function(r){
    return '<tr><td>'+dbr(r.d)+'</td>'+BF.map(function(f){return '<td>'+nf(r[f[0]])+'</td>'}).join('')+'<td><button class="rm" type="button" data-bdel="'+r.d+'">Remover</button></td></tr>';
  }).join('');
  out.innerHTML=(sum?'<div class="card"><b>Variação desde a primeira medida</b><div class="sum">'+sum+'</div></div>':'')+
    (bodyChart()?'<div class="card"><b>Peso (kg)</b>'+bodyChart()+'</div>':'')+
    '<div class="scroller"><table style="min-width:480px"><tr><th>Data</th><th>Peso kg</th><th>Braço cm</th><th>Perna cm</th><th>Abdômen cm</th><th>Peito cm</th><th></th></tr>'+rows+'</table></div>';
  out.querySelectorAll('[data-bdel]').forEach(function(b){
    b.onclick=function(){
      if(b.dataset.arm!=='1'){b.dataset.arm='1';b.textContent='Confirmar remoção';return}
      BODY=BODY.filter(function(r){return r.d!==b.dataset.bdel});saveBody();renderBody();
    };
  });
}
function bindBody(){
  var msg=document.getElementById('bMsg');
  document.getElementById('bDate').value=ymd();
  document.getElementById('bodyForm').onsubmit=function(e){
    e.preventDefault();
    var d=document.getElementById('bDate').value||ymd(),rec={d:d},any=false;
    BF.forEach(function(f){var v=parseNum(document.getElementById('b_'+f[0]).value);if(v!=null){rec[f[0]]=v;any=true}});
    if(!any){msg.textContent='Preencha pelo menos um valor (use números, como 75,4).';return}
    var i=BODY.findIndex(function(r){return r.d===d});
    if(i>-1)BODY[i]=Object.assign(BODY[i],rec);else BODY.push(rec);
    BODY.sort(function(a,b){return a.d<b.d?-1:1});
    saveBody();
    BF.forEach(function(f){document.getElementById('b_'+f[0]).value=''});
    msg.textContent='Salvo em '+dbr(d)+'.';
    renderBody();
  };
  renderBody();
}

/* ---------- áudio: bipes, voz e música ---------- */
var T={steps:[],i:-1,end:0,left:0,paused:false,iv:null,lock:null,ctx:null,lastSec:-1,midDone:false,tenDone:false,job:null,tok:0,state:''};
var $=function(id){return document.getElementById(id)};
function fmt(ms){var s=Math.max(0,Math.ceil(ms/1000));return Math.floor(s/60)+':'+('0'+(s%60)).slice(-2)}
function actx(){
  try{
    if(!T.ctx)T.ctx=new (window.AudioContext||window.webkitAudioContext)();
    if(T.ctx.state==='suspended')T.ctx.resume();
  }catch(e){}
  return T.ctx;
}
function beep(freq,dur){
  if(!S.beeps||S.vBeeps<=0)return;
  try{
    var c=actx(),o=c.createOscillator(),g=c.createGain();
    o.frequency.value=freq;o.type='sine';g.gain.value=.6*S.vBeeps;o.connect(g);g.connect(c.destination);
    o.start();o.stop(c.currentTime+dur/1000);
  }catch(e){}
}
function buzz(p){try{if(navigator.vibrate)navigator.vibrate(p)}catch(e){}}
var M={iv:null,n:0,phase:null,gain:null,duck:false,noise:null};
function mLevel(){if(M.gain&&T.ctx)M.gain.gain.setTargetAtTime((M.duck?0.4:1)*S.vMusic*3.5,T.ctx.currentTime,0.2)}
// fala o texto e chama cb só quando a fala termina (ou, se o aparelho não avisar, após uma estimativa)
function speakThen(text,cb){
  var tok=T.tok;
  if(!S.voice||!text||!('speechSynthesis' in window)){setTimeout(function(){if(tok===T.tok)cb()},50);return}
  var fin=false,tm=null;
  function end(){
    if(fin)return;fin=true;clearTimeout(tm);
    if(tok!==T.tok)return;
    M.duck=false;mLevel();cb();
  }
  try{
    speechSynthesis.cancel();
    setTimeout(function(){
      if(tok!==T.tok)return;
      var u=new SpeechSynthesisUtterance(text);u.lang='pt-BR';u.volume=S.vVoice;
      var v=pickVoice();if(v)u.voice=v;
      u.onstart=function(){if(tok===T.tok){M.duck=true;mLevel()}};
      u.onend=end;u.onerror=end;
      speechSynthesis.speak(u);
      tm=setTimeout(end,text.length*95+5000);
    },80);
  }catch(e){setTimeout(end,50)}
}
function say(text){speakThen(text,function(){})}
// todos os sons da música passam por um filtro suave (M.inp) para soar "abafado", estilo fita
function tone(type,f,t,dur,vol,f2){
  var c=T.ctx,o=c.createOscillator(),g=c.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);
  if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(M.inp);o.start(t);o.stop(t+dur+0.05);
}
function noiseBuf(){
  var c=T.ctx;
  if(!M.noise){var b=c.createBuffer(1,Math.floor(c.sampleRate*0.3),c.sampleRate),d=b.getChannelData(0);for(var i=0;i<d.length;i++)d[i]=Math.random()*2-1;M.noise=b}
  return M.noise;
}
function burst(t,type,freq,vol,dur){
  var c=T.ctx,s=c.createBufferSource();s.buffer=noiseBuf();
  var f=c.createBiquadFilter();f.type=type;f.frequency.value=freq;
  var g=c.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  s.connect(f);f.connect(g);g.connect(M.inp);s.start(t);s.stop(t+dur+0.02);
}
// piano elétrico: seno + harmônico suave, com leve desafinação
function keys(freqs,t,dur,vol){
  var c=T.ctx;
  freqs.forEach(function(fr){
    var o=c.createOscillator(),o2=c.createOscillator(),g=c.createGain(),g2=c.createGain();
    o.type='sine';o.frequency.value=fr;o.detune.value=(Math.random()-.5)*16;
    o2.type='triangle';o2.frequency.value=fr*2;g2.gain.value=0.2;
    o2.connect(g2);g2.connect(g);o.connect(g);
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.015);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    g.connect(M.inp);o.start(t);o2.start(t);o.stop(t+dur+0.05);o2.stop(t+dur+0.05);
  });
}

/* estilo animado (o antigo) */
var BASS=[55,0,0,55,0,0,65.4,0,55,0,0,73.4,0,0,65.4,0];
var LEAD=[220,261.6,329.6,392,329.6,261.6];
function stepPop(n,t){
  var k=n%16;
  if(M.phase==='rest'){
    if(n%32===0)[220,261.6,329.6].forEach(function(f){tone('triangle',f,t,5,0.14)});
    if(k%4===2)tone('sine',LEAD[(n>>2)%LEAD.length]*2,t,0.8,0.08);
    return;
  }
  if(k%4===0)tone('sine',140,t,0.18,0.9,45);
  if(k%4===2)burst(t,'highpass',7000,0.22,0.05);
  if(BASS[k])tone('triangle',BASS[k]*2,t,0.2,0.5);
  if(k%2===0&&n%64>=32)tone('square',LEAD[(n>>1)%LEAD.length],t,0.1,0.05);
}

/* estilo lofi: acordes de sétima/nona (Dm9, G13, Cmaj9, Am9), bateria suave com swing e chiado de vinil */
var CH=[[146.83,174.61,220,261.63,329.63],[196,246.94,329.63,349.23],[164.81,196,246.94,293.66],[220,261.63,329.63,392,493.88]];
var RT=[73.42,98,65.41,55];
var PENTA=[587.33,698.46,783.99,880,1046.5];
function stepLofi(n,t){
  var k=n%16,bar=(n>>4)%4,d=M.dur;
  if(Math.random()<0.1)burst(t+Math.random()*d,'highpass',3500,0.025,0.012);   // chiado de vinil
  if(M.phase==='rest'){
    if(k===0){keys(CH[bar],t,d*15,0.07);tone('sine',RT[bar],t,d*10,0.3)}
    if(k%4===2&&Math.random()<0.28)keys([PENTA[Math.floor(Math.random()*PENTA.length)]],t,d*6,0.05);
    return;
  }
  if(k===0){keys(CH[bar],t,d*7,0.09);tone('sine',RT[bar],t,d*6,0.4)}
  if(k===7){keys(CH[bar].slice(1),t,d*3,0.06)}
  if(k===10){keys(CH[bar],t,d*4,0.07);tone('sine',RT[bar]*1.5,t,d*3,0.25)}
  if(k===0||k===10)tone('sine',115,t,0.2,0.55,42);                       // bumbo macio
  if(k===4||k===12){burst(t,'bandpass',1700,0.2,0.14);tone('triangle',190,t,0.1,0.1,120)}   // caixa
  if(k%2===0)burst(t,'highpass',6500,k%4===0?0.05:0.03,0.04);            // chimbal
  if(bar>=2&&k%2===0&&Math.random()<0.22)keys([PENTA[Math.floor(Math.random()*PENTA.length)]],t,d*5,0.05);
}
function mTick(){
  var c=T.ctx;if(!c||!M.gain)return;
  while(M.next<c.currentTime+0.25){
    var n=M.n++,swing=(n%2)?M.dur*0.22:0;
    var t=M.next+swing;
    if(S.style==='pop')stepPop(n,t);else stepLofi(n,t);
    M.next+=M.dur;
  }
}
function musicStart(phase){
  if(!S.music)return;
  if(M.iv&&M.phase===phase)return;
  clearInterval(M.iv);
  var c=actx();if(!c)return;
  if(!M.gain){
    M.gain=c.createGain();M.gain.gain.value=0;
    var comp=c.createDynamicsCompressor();
    M.inp=c.createBiquadFilter();M.inp.type='lowpass';M.inp.frequency.value=S.style==='pop'?9000:3200;
    M.inp.connect(M.gain);M.gain.connect(comp);comp.connect(c.destination);
  }
  M.inp.frequency.value=S.style==='pop'?9000:3200;
  var bpm=S.style==='pop'?(phase==='rest'?72:118):(phase==='rest'?66:78);
  M.phase=phase;M.n=0;M.dur=60/bpm/4;M.next=c.currentTime+0.08;mLevel();
  M.iv=setInterval(mTick,60);
}
function musicStop(){
  clearInterval(M.iv);M.iv=null;M.phase=null;
  if(M.gain&&T.ctx)M.gain.gain.setTargetAtTime(0,T.ctx.currentTime,0.1);
}

/* ---------- montagem das sequências ---------- */
function words(s){if(s>=60){var m=Math.round(s/60);return m+(m===1?' minuto':' minutos')}return s+' segundos'}
function repsText(r){return /lado/.test(r)?r.replace(' por lado',' repetições por lado'):r+' repetições'}
function repEstimate(r){
  var m=String(r).match(/(\d+)(?:\s*a\s*(\d+))?/),n=m?+(m[2]||m[1]):8;
  if(/lado/.test(r))n*=2;
  return Math.max(15,n*4);
}
function lowerFirst(s){return s.charAt(0).toLowerCase()+s.slice(1)}
// instruções faladas do exercício; não consomem o tempo da série
function howTo(k){
  var e=EX[k],st=e.steps;
  var parts=st.map(function(s,i){
    var w=st.length===1?'':(i===0?'Primeiro':(i===st.length-1?'Por fim':'Depois'));
    return w?w+', '+lowerFirst(s):s;
  });
  return e.n+'. Como fazer. '+parts.join(' ')+(e.warn?' Atenção: '+e.warn:'');
}
function briefStep(k,lead){return {t:'brief',ex:k,title:EX[k].n,sub:'Ouça as instruções',say:(lead||'')+howTo(k)}}
function itemSteps(it,nextName,lead,gap,nextKey){
  var name=EX[it.ex].n,sets=it.sets||1,out=[briefStep(it.ex,lead)];
  for(var s=1;s<=sets;s++){
    var side=it.alt?it.alt[(s-1)%it.alt.length]:'';
    var sub=(sets>1?'Série '+s+' de '+sets:'')+(side?' · '+side:'');
    var pre=(sets>1?'Série '+s+' de '+sets+'. ':'')+(side?side+'. ':'');
    if(it.work)out.push({t:'work',ex:it.ex,secs:it.work,title:name,sub:sub||'Mantenha a posição',say:pre+'Segure por '+words(it.work)+'. Comece.'});
    else out.push({t:'reps',ex:it.ex,secs:repEstimate(it.reps),title:name,sub:(sub?sub+' · ':'')+(it.txt||repsText(it.reps)),say:pre+'Faça '+(it.txt||repsText(it.reps))+', devagar. Comece.',mid:/lado/.test(it.reps)?'Troque de lado.':null});
    if(s<sets){
      var nside=it.alt?it.alt[s%it.alt.length]:'';
      out.push({t:'rest',ex:it.ex,secs:it.rest||45,title:'Intervalo',sub:'Próxima: série '+(s+1)+' de '+sets+(nside?' · '+nside:''),say:'Pare. Série '+s+' de '+sets+' concluída. Intervalo de '+words(it.rest||45)+'.'});
    }
  }
  if(nextName)out.push({t:'rest',ex:nextKey,secs:gap||120,title:'Descanso entre exercícios',sub:'Próximo: '+nextName,say:'Pare. Exercício concluído. Descanse '+words(gap||120)+'. O próximo exercício é '+nextName+'.'});
  return out;
}
function circuitSteps(t){
  var list=t.list,n=list.length;
  var out=[{t:'brief',title:'Circuito leve',sub:'Ouça as instruções',say:'Treino de hoje: '+t.title.replace(':',',')+'. São '+n+' exercícios, repetidos em 3 rodadas. Em cada exercício você trabalha 35 segundos e descansa 30. Na primeira rodada eu explico cada exercício antes de começar.'}];
  for(var r=1;r<=3;r++)for(var j=0;j<n;j++){
    var name=EX[list[j].ex].n;
    if(r===1)out.push(briefStep(list[j].ex,'Exercício '+(j+1)+' de '+n+'. '));
    out.push({t:'work',ex:list[j].ex,secs:list[j].work,title:name,sub:'Rodada '+r+' de 3 · exercício '+(j+1)+' de '+n,say:'Rodada '+r+', '+name+'. Comece.'});
    if(!(r===3&&j===n-1)){
      var endRound=(j===n-1),nx=EX[list[endRound?0:j+1].ex].n,secs=endRound?60:30;
      out.push({t:'rest',ex:list[endRound?0:j+1].ex,secs:secs,title:endRound?'Descanso entre rodadas':'Intervalo',sub:'Próximo: '+nx,say:'Pare. '+(endRound?'Rodada '+r+' concluída. ':'')+'Descanse '+words(secs)+'. Próximo: '+nx+'.'});
    }
  }
  return out;
}
function workoutSteps(k){
  var t=TREINOS[k];
  if(t.circuit)return circuitSteps(t);
  var out=[];
  t.list.forEach(function(it,i){
    var lead=i===0?(k==='W'?'Vamos ao aquecimento, '+t.list.length+' movimentos leves. Primeiro: ':'Treino de hoje: '+t.title.replace(':',',')+'. São '+t.list.length+' exercícios. Primeiro exercício: '):'';
    out=out.concat(itemSteps(it,i<t.list.length-1?EX[t.list[i+1].ex].n:null,lead,t.gap,i<t.list.length-1?t.list[i+1].ex:null));
  });
  return out;
}
function walkSteps(m){
  return [{t:'work',secs:300,title:'Caminhada',sub:'Aquecimento: passo leve',say:'Caminhada de '+m+' minutos. Comece com 5 minutos de passo leve.'},
          {t:'work',secs:(m-10)*60,title:'Caminhada',sub:'Ritmo firme, ainda dá para conversar',say:'Agora ritmo firme, por '+words((m-10)*60)+'.'},
          {t:'work',secs:300,title:'Caminhada',sub:'Desaquecimento: passo leve',say:'Reduza para passo leve, por 5 minutos.'}];
}

/* ---------- execução: primeiro a voz, depois a contagem ---------- */
function startQueue(steps,job){
  actx();
  T.steps=steps;T.i=-1;T.ok=0;T.paused=false;T.job=job||null;
  $('timer').hidden=false;document.body.classList.add('timing');
  getLock();
  nextStep();
}
function getLock(){try{if(navigator.wakeLock)navigator.wakeLock.request('screen').then(function(l){T.lock=l;l.addEventListener('release',function(){T.lock=null})}).catch(function(){})}catch(e){}}
document.addEventListener('visibilitychange',function(){if(!document.hidden&&T.steps.length&&!T.lock)getLock()});
function nextStep(){
  clearInterval(T.iv);T.i++;T.tok++;
  if(T.i>=T.steps.length){finish();return}
  var s=T.steps[T.i],nx=T.steps[T.i+1];
  T.midDone=false;T.tenDone=false;T.lastSec=-1;T.paused=false;
  $('timer').dataset.phase=s.t==='rest'||s.t==='brief'?'rest':'work';
  setTitle(s);$('tSub').textContent=s.sub||'';
  var follow=nx&&nx.t==='brief'?nx.title:nx;
  $('tNext').textContent=nx?'A seguir: '+(nx.t==='rest'?'intervalo':nx.title):'Último passo';
  $('tPause').hidden=false;$('tPause').textContent='Pausar';$('tDone').hidden=true;
  begin(s);
}
function begin(s){
  T.state='speaking';
  $('tPhase').textContent=s.t==='brief'?'Instruções':'Ouça';
  if(s.t==='brief'){$('tClock').textContent='Ouça';$('tClock').className='t-clock sm'}
  else{$('tClock').textContent=fmt(s.secs*1000);$('tClock').className='t-clock'}
  $('tBar').style.width='0';
  musicStart(s.t==='rest'||s.t==='brief'?'rest':'work');
  speakThen(s.say,function(){afterSpeech(s)});
}
function afterSpeech(s){
  if(s.t==='brief'){T.ok++;nextStep();return}
  T.state='counting';
  $('tPhase').textContent=s.t==='rest'?'Intervalo':'Exercício';
  $('tDone').hidden=s.t!=='reps';
  T.left=s.secs*1000;T.end=Date.now()+T.left;
  beep(s.t==='rest'?520:880,250);buzz(s.t==='rest'?120:[120,60,120]);
  musicStart(s.t==='rest'?'rest':'work');
  paint();T.iv=setInterval(tick,200);
}
function paint(){
  var s=T.steps[T.i];if(!s||!s.secs)return;
  $('tClock').textContent=fmt(T.left);
  $('tBar').style.width=(100-T.left/(s.secs*1000)*100)+'%';
}
function tick(){
  if(T.paused||T.state!=='counting')return;
  var s=T.steps[T.i];if(!s)return;
  T.left=T.end-Date.now();
  if(T.left<=0){T.ok++;beep(1200,400);buzz(300);nextStep();return}
  var sec=Math.ceil(T.left/1000);
  if(s.mid&&!T.midDone&&T.left<=s.secs*500){T.midDone=true;beep(700,200);say(s.mid)}
  if(sec===10&&s.secs>=30&&!T.tenDone){T.tenDone=true;say('Dez segundos.')}
  if(sec<=3&&sec!==T.lastSec){T.lastSec=sec;beep(660,120)}
  paint();
}
function finish(){
  clearInterval(T.iv);T.state='done';
  var total=T.steps.length,pct=total?Math.round(T.ok/total*100):0;
  var enough=pct>=80;                       // só conta se pelo menos 80% dos passos foram concluídos (pular não conta)
  var walk=T.job&&T.job.kind==='walk',warm=T.job&&T.job.kind==='warm',reg=T.job&&!warm;
  var msg=reg?(enough?register(T.job):'Não registrado: você concluiu '+pct+'% dos passos e o mínimo é 80%.'):'';
  var bad=reg&&!enough;
  $('timer').dataset.phase='work';$('tPhase').textContent=bad?'Encerrado':'Concluído';
  $('tTitle').textContent=bad?'Sequência incompleta':'Muito bem!';
  $('tSub').textContent=warm?'Aquecimento terminado. Beba um pouco de água e siga para o treino.':(reg?(walk?'Caminhada terminada. ':'Sequência terminada. ')+msg:'Exercício terminado.');
  $('tClock').className='t-clock sm';$('tClock').textContent='Fim';$('tBar').style.width='100%';$('tNext').textContent='';
  $('tDone').hidden=true;$('tPause').hidden=true;
  say(warm?'Pare. Aquecimento concluído. Beba um pouco de água e vamos ao treino.':(reg?(bad?'Pare. Sequência encerrada sem registro, porque menos de 80 por cento dos passos foram concluídos.':'Pare. '+(walk?'Caminhada concluída':'Treino concluído')+'. Parabéns! '+msg):'Pare. Exercício concluído.'));
  beep(660,200);setTimeout(function(){beep(880,200)},250);setTimeout(function(){beep(1100,350)},500);buzz([200,100,200,100,400]);
  setTimeout(musicStop,8000);
  T.i=T.steps.length;
  if(current==='hoje'||current==='progresso')show(current);
}
/* ---------- janela "como fazer" sobre o treino ---------- */
var modalFrom=null,modalIv=null;
function setTitle(s){
  var el=$('tTitle');
  if(s.ex&&EX[s.ex]){
    el.textContent='';
    var b=document.createElement('button');b.type='button';b.className='ex-link';b.dataset.act='showex';b.dataset.ex=s.ex;b.textContent=s.title;
    var h=document.createElement('span');h.className='ex-hint';h.textContent=' · ver '+(s.t==='rest'?EX[s.ex].n:'como fazer');
    el.appendChild(b);el.appendChild(h);
  }else el.textContent=s.title;
}
function openEx(k,from){
  var e=EX[k];if(!e)return;
  $('exBody').innerHTML=exHTML({n:e.n,dose:'',fig:e.fig,labels:e.labels,steps:e.steps,tip:e.tip,warn:e.warn});
  $('exModal').hidden=false;modalFrom=from||null;
  $('mClock').textContent=$('tClock').textContent;
  clearInterval(modalIv);modalIv=setInterval(function(){$('mClock').textContent=$('tClock').textContent},300);
  $('exClose').focus();
}
function closeEx(){
  if($('exModal').hidden)return;
  $('exModal').hidden=true;clearInterval(modalIv);
  if(modalFrom&&document.body.contains(modalFrom))modalFrom.focus();
}
$('exClose').onclick=closeEx;
$('exModal').onclick=function(e){if(e.target===this)closeEx()};
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeEx()});
function stop(){
  closeEx();
  clearInterval(T.iv);T.steps=[];T.job=null;T.tok++;T.state='';
  try{speechSynthesis.cancel()}catch(e){}
  M.duck=false;musicStop();
  $('timer').hidden=true;document.body.classList.remove('timing');$('tVol').hidden=true;
  try{if(T.lock){T.lock.release();T.lock=null}}catch(e){}
}
$('tDone').onclick=function(){if(T.state==='counting'){T.ok++;nextStep()}};
$('tSkip').onclick=function(){if(T.i<T.steps.length)nextStep();else stop()};
$('tStop').onclick=stop;
$('tPause').onclick=function(){
  var s=T.steps[T.i];if(!s)return;
  if(T.paused){
    T.paused=false;$('tPause').textContent='Pausar';
    if(T.state==='speaking')begin(s);
    else{T.end=Date.now()+T.left;musicStart(s.t==='rest'?'rest':'work')}
  }else{
    T.paused=true;T.tok++;
    if(T.state==='counting')T.left=T.end-Date.now();
    $('tPause').textContent='Continuar';
    try{speechSynthesis.cancel()}catch(e){}
    M.duck=false;musicStop();
  }
};
$('tVol').innerHTML=volRows('tv');
bindVol('tv');
$('tVolBtn').onclick=function(){var v=$('tVol');v.hidden=!v.hidden;if(!v.hidden)bindVol('tv')};

/* ---------- cliques ---------- */
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b)return;
  var a=b.dataset.act;
  if(a==='go')show(b.dataset.v);
  else if(a==='wk')startQueue(workoutSteps(b.dataset.w),{kind:b.dataset.w==='W'?'warm':'workout',k:b.dataset.w});
  else if(a==='testvoice'){
    actx();say('Olá! Esta é a voz do seu treino. Comece.');beep(880,250);
    if(!T.steps.length){musicStart('work');setTimeout(function(){if(!T.steps.length)musicStop()},5000)}
  }
  else if(a==='ex'){
    var t=TREINOS[b.dataset.w],it=t.list[+b.dataset.i];
    var st=itemSteps(it,null);
    startQueue(st);
  }
  else if(a==='showex')openEx(b.dataset.ex,b);
  else if(a==='walk')startQueue(walkSteps(+b.dataset.m),{kind:'walk'});
});

var start=(location.hash||'').slice(1);
show(VIEWS[start]?start:'hoje');
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(){})}
</script>
